name: build-packages

# Build Windows x64 only. PRs and manual checks upload Actions artifacts;
# fork release branches, version tags, and requested manual releases publish here.
on:
  workflow_dispatch:
    inputs:
      publish_release:
        description: "Publish Windows packages to this repository's GitHub Releases"
        type: boolean
        default: false
      release_tag:
        description: "Optional configured fork tag (e.g. v1.1.85-c3nhx.1)"
        type: string
        default: ""
  push:
    branches:
      - "release/windows-v*"
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+-c3nhx.[0-9]*"
  pull_request:
    paths:
      - ".github/workflows/build.yml"
      - "components/AppLockGate.tsx"
      - "components/TrayPanel.tsx"
      - "index.tsx"
      - "index.css"
      - "build/**"
      - "electron-builder.config.cjs"
      - "fork-release.json"
      - "domain/forkRelease.mjs"
      - "electron/**"
      - "!electron/**/*.test.*"
      - "!electron/**/*.spec.*"
      - "!electron/**/__tests__/**"
      - "!electron/**/test/**"
      - "!electron/**/tests/**"
      - "!electron/**/example/**"
      - "!electron/**/examples/**"
      - "!electron/plugins/fixtures/**"
      - "infrastructure/config/terminalFlowConstants.*"
      - "lib/**/*.cjs"
      - "lib/**/*.json"
      - "package.json"
      - "package-lock.json"
      - "packages/plugin-*/**"
      - "patches/**"
      - "public/icon*"
      - "resources/**"
      - "scripts/afterPackMacUuid.cjs"
      - "scripts/beforePackCursorSdk.cjs"
      - "scripts/build-et/**"
      - "scripts/build-mosh/**"
      - "scripts/ensure-node-pty-linux.sh"
      - "scripts/et-extra-resources.cjs"
      - "scripts/fetch-et-binaries.cjs"
      - "scripts/fetch-mosh-binaries.cjs"
      - "scripts/linux/**"
      - "scripts/mosh-extra-resources.cjs"
      - "scripts/nodePtyConptyPatch.cjs"
      - "scripts/set-fork-version.cjs"
      - "scripts/patch-xterm-macos-column-selection.cjs"
      - "scripts/patch-xterm-foreground-intense.cjs"
      - "scripts/patch-xterm-webgl-atlas.cjs"
      - "scripts/rebuildPatchedNodePty.cjs"
      - "scripts/resolve-et-bin-release.cjs"
      - "scripts/resolve-mosh-bin-release.cjs"
      - "scripts/tray-panel-layout.live.test.cjs"
      - "scripts/verify-linux-*.sh"
      - "scripts/xterm-macos-column-selection.live.test.cjs"
      - "skills/**"

concurrency:
  group: build-packages-${{ github.ref_type == 'tag' && format('release-{0}', github.ref_name) || inputs.publish_release && format('release-{0}', inputs.release_tag) || github.event_name == 'workflow_dispatch' && format('manual-{0}', github.run_id) || github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' && !startsWith(github.ref_name, 'release/windows-v') && !inputs.publish_release }}

permissions:
  contents: read

env:
  NPM_CONFIG_FETCH_RETRIES: "4"
  NPM_CONFIG_FETCH_RETRY_FACTOR: "2"
  NPM_CONFIG_FETCH_RETRY_MINTIMEOUT: "1000"
  NPM_CONFIG_FETCH_RETRY_MAXTIMEOUT: "10000"

jobs:
  build:
    name: build-windows
    runs-on: windows-latest
    timeout-minutes: 40
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      version: ${{ steps.version.outputs.version }}
      publish: ${{ steps.version.outputs.publish }}
      upstream_version: ${{ steps.version.outputs.upstream_version }}
      upstream_commit: ${{ steps.version.outputs.upstream_commit }}
      patch: ${{ steps.version.outputs.patch }}
    env:
      VITE_SYNC_GITHUB_CLIENT_ID: ${{ secrets.VITE_SYNC_GITHUB_CLIENT_ID }}
      VITE_SYNC_GOOGLE_CLIENT_ID: ${{ secrets.VITE_SYNC_GOOGLE_CLIENT_ID }}
      VITE_SYNC_GOOGLE_CLIENT_SECRET: ${{ secrets.VITE_SYNC_GOOGLE_CLIENT_SECRET }}
      VITE_SYNC_ONEDRIVE_CLIENT_ID: ${{ secrets.VITE_SYNC_ONEDRIVE_CLIENT_ID }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Set version
        id: version
        shell: bash
        env:
          PUBLISH_RELEASE: ${{ inputs.publish_release }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: node scripts/set-fork-version.cjs

      - name: Verify official baseline and release tag
        if: steps.version.outputs.publish == 'true'
        shell: bash
        env:
          UPSTREAM_VERSION: ${{ steps.version.outputs.upstream_version }}
          UPSTREAM_COMMIT: ${{ steps.version.outputs.upstream_commit }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        run: |
          set -euo pipefail
          git fetch --no-tags https://github.com/binaricat/Netcatty.git "refs/tags/v$UPSTREAM_VERSION"
          actual="$(git rev-parse 'FETCH_HEAD^{commit}')"
          test "$actual" = "$UPSTREAM_COMMIT" || { echo "::error::Official tag does not match fork-release.json"; exit 1; }
          git merge-base --is-ancestor "$actual" HEAD || { echo "::error::Release source does not contain the official version"; exit 1; }
          existing="$(git ls-remote --tags origin "refs/tags/$RELEASE_TAG" "refs/tags/$RELEASE_TAG^{}" | sort -k2r | head -n 1 | cut -f1)"
          if [[ -n "$existing" && "$existing" != "$GITHUB_SHA" ]]; then
            echo "::error::Release tag $RELEASE_TAG already points at another commit."
            exit 1
          fi

      - name: Set up MSVC developer command prompt
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Restore Electron download cache
        uses: actions/cache@v6
        with:
          path: |
            ~/AppData/Local/electron/Cache
            ~/AppData/Local/electron-builder/Cache
          key: electron-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            electron-${{ runner.os }}-${{ runner.arch }}-

      - name: Install deps
        run: npm ci

      - name: Compile ConPTY test helpers
        shell: pwsh
        run: |
          $compiler = "$env:WINDIR\Microsoft.NET\Framework64\v4.0.30319\csc.exe"
          if (-not (Test-Path $compiler)) { throw "csc.exe not found" }
          New-Item -ItemType Directory -Force -Path "$env:RUNNER_TEMP\netcatty-mosh-conpty" | Out-Null
          & $compiler /nologo /target:exe /out:"$env:RUNNER_TEMP\netcatty-mosh-conpty\ssh.exe" electron\bridges\fixtures\mosh-conpty-fake-ssh.cs
          if ($LASTEXITCODE -ne 0) { throw "failed to compile fake ssh" }
          & $compiler /nologo /target:exe /out:"$env:RUNNER_TEMP\netcatty-mosh-conpty\mosh-client.exe" electron\bridges\fixtures\mosh-conpty-fake-client.cs
          if ($LASTEXITCODE -ne 0) { throw "failed to compile fake mosh-client" }

      - name: Test Mosh handshake through ConPTY
        shell: pwsh
        env:
          NETCATTY_TEST_MOSH_SSH_EXE: ${{ runner.temp }}\netcatty-mosh-conpty\ssh.exe
          NETCATTY_TEST_MOSH_CLIENT_EXE: ${{ runner.temp }}\netcatty-mosh-conpty\mosh-client.exe
        run: |
          node --test electron/bridges/moshHandshake.test.cjs
          node electron/bridges/terminalBridge.moshConpty.integration.cjs

      - name: Bundle Windows terminal clients
        if: steps.version.outputs.publish == 'true'
        env:
          # These repositories supply downloads only; no package is published there.
          MOSH_BIN_OWNER: binaricat
          MOSH_BIN_REPO: MoshCatty
          ET_BIN_OWNER: binaricat
          ET_BIN_REPO: Netcatty-et-bin
          MOSH_BIN_RELEASE: ${{ vars.MOSH_BIN_RELEASE }}
          ET_BIN_RELEASE: ${{ vars.ET_BIN_RELEASE }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          node scripts/fetch-mosh-binaries.cjs --platform=win32 --arch=x64 --resolve-release
          node scripts/fetch-et-binaries.cjs --platform=win32 --arch=x64 --resolve-release

      - name: Build package
        env:
          ELECTRON_BUILDER_PUBLISH: "never"
        run: npm run pack:win-x64

      - name: Verify packaged ConPTY threshold
        shell: pwsh
        run: |
          $agent = Get-Content release/win-unpacked/resources/app.asar.unpacked/node_modules/node-pty/lib/windowsPtyAgent.js -Raw
          if ($agent -notmatch '_getWindowsBuildNumber\(\)\s*>=\s*17763') {
            throw "Packaged node-pty is missing the ConPTY build 17763 patch"
          }

      - name: Test tray panel layout
        run: npm run test:tray-panel-layout

      - name: Test tray panel layout at 200% scale on Windows
        env:
          NETCATTY_TRAY_LAYOUT_SCALE: "2"
        run: npm run test:tray-panel-layout

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: netcatty-windows
          path: |
            release/*.exe
            release/*.zip
            release/*.yml
            release/*.blockmap
          if-no-files-found: error

  release:
    name: release-windows
    needs: build
    if: needs.build.outputs.publish == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: fork-release-${{ needs.build.outputs.tag }}
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      - name: Download Windows artifacts
        uses: actions/download-artifact@v8
        with:
          name: netcatty-windows
          path: artifacts

      - name: Verify release files and generate checksums
        shell: bash
        env:
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          for file in "Netcatty-$VERSION-win-x64.exe" "Netcatty-$VERSION-portable-win-x64.exe" "Netcatty-$VERSION-win-x64.zip"; do
            test -s "artifacts/$file" || { echo "::error::Missing $file"; exit 1; }
          done
          cd artifacts
          sha256sum *.exe *.zip *.yml *.blockmap > SHA256SUMS

      - name: Publish Windows release to this repository
        uses: softprops/action-gh-release@v2
        with:
          repository: ${{ github.repository }}
          token: ${{ github.token }}
          tag_name: ${{ needs.build.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: Netcatty ${{ needs.build.outputs.tag }} (C3nHx Windows x64)
          draft: false
          prerelease: true
          body: |
            Windows x64 build of C3nHx/Netcatty.

            Official baseline: binaricat/Netcatty v${{ needs.build.outputs.upstream_version }}
            Official commit: ${{ needs.build.outputs.upstream_commit }}
            C3nHx patch: ${{ needs.build.outputs.patch }}
            Update channel: c3nhx

            - Includes the node-pty ConPTY selection threshold patch: Windows build 17763 and later.
            - Includes the installer, portable executable, ZIP archive, and SHA256SUMS.
            - ConPTY integration and tray layout tests must pass before publication.
            - Native execution on Windows build 17763 has not been verified.

            Source commit: ${{ github.sha }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            artifacts/*.exe
            artifacts/*.zip
            artifacts/*.yml
            artifacts/*.blockmap
            artifacts/SHA256SUMS
